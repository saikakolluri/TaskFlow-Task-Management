<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Task Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>TaskFlow</h1>
            <p>Organize your tasks. Get things done.</p>
        </div>
    </header>


    <!-- Main Content -->
    <main class="container">

        <!-- Add Task -->
        <section class="card task-form-section">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="form-group">

                    <label for="taskInput">
                        Task Name
                    </label>

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter your task..."
                        autocomplete="off"
                    >

                </div>


                <div class="form-group">

                    <label for="categoryInput">
                        Category
                    </label>

                    <select id="categoryInput">

                        <option value="Study">
                            Study
                        </option>

                        <option value="Work">
                            Work
                        </option>

                        <option value="Personal">
                            Personal
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="add-btn"
                >
                    + Add Task
                </button>

            </form>

        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">

                <div class="stat-icon">
                    📋
                </div>

                <div>
                    <h3 id="totalTasks">0</h3>
                    <p>Total Tasks</p>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ⏳
                </div>

                <div>
                    <h3 id="activeTasks">0</h3>
                    <p>Active Tasks</p>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ✅
                </div>

                <div>
                    <h3 id="completedTasks">0</h3>
                    <p>Completed</p>
                </div>

            </div>

        </section>


        <!-- Search and Filter -->
        <section class="card controls">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search tasks..."
                    autocomplete="off"
                >

            </div>


            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="active"
                >
                    Active
                </button>

                <button
                    class="filter-btn"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>

        </section>


        <!-- Task List -->
        <section class="card task-section">

            <div class="section-heading">

                <div>
                    <h2>My Tasks</h2>
                    <p>Manage your daily activities</p>
                </div>

            </div>


            <div id="taskList">
                <!-- Tasks will be generated using JavaScript -->
            </div>


            <div
                id="emptyMessage"
                class="empty-message"
            >
                <div class="empty-icon">
                    📝
                </div>

                <h3>No tasks found</h3>

                <p>
                    Add a task above to get started!
                </p>
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            TaskFlow © 2026 | JavaScript Project
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
